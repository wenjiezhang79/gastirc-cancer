# ============================================================
# 默认配置（全部参数及说明）。不要直接修改本文件：
#   服务器上复制 configs/server_example.yaml 为 configs/server.yaml，只改需要改的项。
# 路径规则：paths.root 为相对路径时相对于本仓库根目录；其余相对路径相对于 paths.root。
# ============================================================

seed: 2026            # 全局随机种子
num_workers: 4        # 逐病例处理的并行进程数（命令行 --num-workers 可覆盖）

paths:
  root: data                    # 数据根目录
  manifest: manifest.csv        # 病例清单（每行一个病人）
  work_dir: work                # 处理结果（NIfTI、裁剪、切块坐标、特征）
  output_dir: ../outputs        # 每次运行的日志、配置、报告

# ---------------- 病例清单 ----------------
manifest:
  study_id_pattern: '^C\d+-\d+$'   # 研究编号格式，如 C1-0001
  centers: [internal, ext1, ext2, ext3]
  internal_center: internal
  check_paths: true                # 校验切片、CT 文件夹、分割文件是否存在
  strict_paths: false              # true：路径不存在算错误；false：算警告，该模态按缺失处理
  max_os_months: 240               # 随访月数超过该值时警告（可能单位填错）

# ---------------- 训练标签派生规则 ----------------
labels:
  use_post_neoadj: false           # 主分析中 label_source=post_neoadj 的分型和标志物标签按缺失处理
  her2_2plus_without_fish: missing # HER2 IHC 2+ 且无 FISH：missing=按缺失；negative=按阴性
  pdl1_thresholds: [1, 5, 10]      # PD-L1 CPS 阈值（≥ 阈值为阳性）
  pdl1_main_threshold: 5
  cldn182_threshold: 75            # Claudin18.2 阳性：中到强膜染色肿瘤细胞 ≥ 75%
  ki67_threshold: null             # Ki-67 二分类阈值（待定；null 表示暂不生成二分类标签）

# ---------------- 数据划分 ----------------
split:
  test_fraction: 0.2               # 内部中心中内部测试集比例
  n_folds: 5                       # 训练集内交叉验证折数
  seed: 2026
  # 分层变量：每个变量分别在训练/测试、各折之间保持均衡（迭代分层，稀有阳性也能均匀分布）
  stratify_by: [lauren, msi_h, ebv_pos, her2_pos]
  # 内层验证（早停用）比例：每个（随机种子, 留出折）在整个内部训练集的训练部分中分层抽取，
  # 名单保存在 <work_dir>/splits/inner_val/，v1 / v2 / v3 三方共用（见 docs/decisions.md 第十四节第 5 小节）
  inner_val_fraction: 0.15

# ---------------- CT ----------------
ct:
  phase: venous                    # 使用的期相
  # 期相识别关键词（在 SeriesDescription / ProtocolName 中匹配，不区分大小写）
  phase_keywords:
    delayed: [delay, delayed, equilibrium, 延迟, 平衡]
    arterial: [arterial, artery, art, 动脉]
    venous: [venous, portal, pvp, pv, 静脉, 门脉, 门静脉]
    non_contrast: [plain, non-contrast, noncontrast, unenhanced, 平扫, nc]
  # 若没有关键词，按造影剂注射后的延迟时间（秒）判断
  phase_delay_s: {arterial: [15, 50], venous: [50, 110], delayed: [110, 100000]}
  preferred_thickness_mm: 5.0      # 选择序列时优先的层厚
  min_slices: 10                   # 少于该层数的序列视为定位像等，跳过
  slice_spacing_tolerance: 0.1     # 层间距不均匀的容差（相对值）
  allow_nonuniform: false          # 层间距不均匀（疑似缺层）时是否仍然转换
  summary:
    include_series_description: true  # 汇总中输出 SeriesDescription（自由文本；若发现含身份信息请设为 false）
  native_orientation: LPS          # 原始 NIfTI 的统一方向
  hu_clip: [-1024, 3071]
  target_spacing: [0.8, 0.8, 5.0]  # 分析体素 (x, y, z) mm；z=5 mm 已确认，层面内间距待 DICOM 汇总后确定
  average_thin_slices: true        # 薄层降到目标层厚时多层平均（模拟厚层），而非直接抽层
  save_resampled: true             # 保存整卷重采样结果（nnU-Net / 整卷编码器使用）
  save_thin_series: false          # 另存同一次采集中最薄的软组织重建（供医生在薄层上标注）
  stomach_mask_dir: null           # 胃分割目录（null = <work_dir>/ct/stomach）
  points:
    annotation_dir: ct_points      # 医生标注文件目录：<study_id>.mrk.json 或 <study_id>_point.nii.gz
  crop:
    point_stomach_max_dist_mm: 20  # 中心点距胃分割超过该距离时提示复核
    specs:
      - name: tumor_96mm
        center: point_or_mask      # point / mask_centroid / point_or_mask（优先点，没有点用分割质心）
        spacing: [0.8, 0.8, 5.0]
        size_vox: [120, 120, 16]   # 96 × 96 × 80 mm
        window: {level: 40, width: 400}   # 腹部软组织窗
        normalize: minmax          # minmax → [0,1]；zscore；none（保留 HU）
      - name: regional_160mm
        center: point_or_mask
        spacing: [0.8, 0.8, 5.0]
        size_vox: [200, 200, 32]   # 160 × 160 × 160 mm
        window: {level: 40, width: 400}
        normalize: minmax
  qc:
    overview_per_page: 48

# ---------------- 病理切片 ----------------
wsi:
  backend: auto                    # auto / openslide / tifffile
  default_base_mpp: null           # 切片中读不到 MPP 和倍率时使用的 level-0 µm/px（如 0.5）；null 则报错
  tissue:
    thumb_mpp: 8.0                 # 组织检测用缩略图的分辨率（µm/px）
    min_saturation: 20             # 饱和度下限（0–255），Otsu 阈值不会低于它
    max_value_white: 235           # 亮度高于此且饱和度低时视为背景
    min_value_black: 40            # 亮度低于此视为黑色笔迹/杂质
    filter_pen: true               # 过滤蓝/绿/黑色笔迹
    min_area_mm2: 0.02             # 最小组织面积
    close_iters: 2
  tiling:
    target_mpp: 0.5                # 20× ≈ 0.5 µm/px
    tile_px: 224
    min_tissue_fraction: 0.25      # 切块中组织占比 ≥ 该值才保留（活检组织少，取值偏低）
  qc:
    overview_per_page: 24

# ---------------- 病理特征提取 ----------------
features:
  extractor: random_small          # 使用的编码器（见 extractors）
  batch_size: 64
  num_workers: 4                   # DataLoader 读取进程数
  precision: bf16                  # GPU 上使用 bf16 混合精度；CPU 上自动使用 fp32
  hash_weights: true               # 记录权重文件 SHA256（核对权重版本）
  dtype: float32                   # 特征保存精度：float32 / float16
  extractors:
    random_small: {feature_dim: 64}
    resnet50_trunc: {weights_path: null}    # torchvision resnet50 ImageNet 权重 .pth
    uni2_h: {weights_path: null}            # UNI2-h pytorch_model.bin
    virchow2: {weights_path: null}          # Virchow2 pytorch_model.bin
    gigapath: {weights_path: null}          # Prov-GigaPath 切块编码器 pytorch_model.bin
    # 通过已安装的 TRIDENT 调用其编码器（CONCH v1.5、MUSK、CHIEF 等），权重路径按 TRIDENT 的本地配置
    trident:
      model_name: null             # TRIDENT 中的编码器名，如 conch_v15 / musk / ctranspath
      kwargs: {}

# ---------------- TRIDENT 特征导入 ----------------
trident:
  job_dir: null                    # TRIDENT 的输出根目录（含 20x_256px_0px_overlap 之类的子目录）
  # TRIDENT 编码器名 → 本项目编码器名（未列出的保持原名）
  name_map:
    uni_v2: uni2_h
    virchow2: virchow2
    conch_v15: conch_v15
    musk: musk
    gigapath: gigapath
    ctranspath: chief_ctranspath
    chief: chief_ctranspath
    resnet50: resnet50_trunc
  # 预期特征维数（不一致时警告）
  expected_dims:
    uni2_h: 1536
    virchow2: 2560
    conch_v15: 768
    musk: 1024
    gigapath: 1536
    chief_ctranspath: 768
    resnet50_trunc: 1024
  min_tiles_warn: 10               # 切块数少于该值时警告

# ---------------- 假数据（测试与演示用） ----------------
fake_data:
  seed: 7
  n_per_center: {internal: 6, ext1: 2, ext2: 1, ext3: 1}
  slide_size_px: [3072, 2048]      # 20× 下的切片尺寸（宽, 高）
  ct_shape: [128, 128]             # CT 层面矩阵
  ct_pixel_spacing: 1.2
  ct_n_slices_5mm: 24
  trident_encoders: {uni_v2: 1536, conch_v15: 768}
  trident_patch_px: 256
  feature_cohort:                  # --features-only：v1 测试/演示用的假特征队列
    n_internal: 200
    n_external: 60
    encoders: {uni2_h: 32, conch_v15: 16}
    tiles: [40, 200]
    signal: 1.0                    # 埋入信号的强度倍数
    seed: 11

# ---------------- v1 病理多任务模型 ----------------
v1:
  encoders: [uni2_h]               # 使用的病理特征（TRIDENT 导入后的编码器名）；写多个表示逐切块拼接
  feature_cache: true              # 特征以 float16 缓存在内存中（约 6 GB / 2000 例）；内存不足时设为 false
  model:
    aggregator: abmil              # abmil（主方案）/ transmil（对照）/ meanpool（简单基线）
    hidden_dim: 256
    attn_dim: 128
    n_branches: 2                  # ABMIL 注意力分支数 = 病理 token 数
    dropout: 0.25
    transmil_heads: 4
  tasks:
    multiclass: [lauren]           # 可加 her2_3cls
    binary: [her2_pos, msi_h, ebv_pos, pdl1_cps1, pdl1_cps5, pdl1_cps10, cldn182_pos]
    regression: []                 # 可加 ki67_frac
    survival: [os, dfs, pfs]
  population_baselines: [os]       # 这些终点按手术/不可切除人群分别设基线风险（共享风险评分）
  loss:
    weighting: uncertainty         # uncertainty（不确定性加权）/ fixed（固定权重）
    fixed_weights: {}              # 固定权重，如 {msi_h: 2.0}；未列出的为 1；也用于早停监测
    max_pos_weight: 10             # 二分类正样本权重上限（权重 = 阴性数/阳性数）
    lauren_class_weight: false
    survival_loss: discrete        # discrete（离散时间，主方案）/ cox（对照）
    survival_bins: 4               # 每个终点、每个人群的时间段数（按事件时间分位数）
  train:
    epochs: 50
    batch_size: 8
    lr: 2.0e-4
    weight_decay: 1.0e-4
    warmup_epochs: 2
    grad_clip: 1.0
    grad_accum: 1
    max_tiles: 2048                # 训练时每例最多随机抽取的切块数（评估时用全部）
    tile_dropout: 0.1              # 训练时随机丢弃的切块比例
    patience: 10                   # 内层验证损失连续多少个 epoch 不下降则停止
    num_workers: 0
    precision: bf16                # GPU 上 bf16 混合精度；CPU 自动 fp32
  seeds: [0]
  horizons_months: [12, 36, 60]    # 输出这些时间点的生存概率
  save_attention: true
  eval:
    n_boot: 1000                   # bootstrap 次数
  compare:
    primary: [lauren, msi_h]       # 编码器比较的排名指标：这些任务主要指标的平均（预先规定）
  profiles:
    screening:                     # 编码器初筛：只训练 Lauren + MSI，3 个随机种子，其余超参数固定
      tasks: {multiclass: [lauren], binary: [msi_h], regression: [], survival: []}
      seeds: [0, 1, 2]

# ============================================================
# v2 CT 分支：胃分割、肿瘤分割、CT 特征、影像组学、CT 单模态多任务模型
# ============================================================
v2:
  # ---- 外部工具：各自装在独立的 Python 环境中（见 docs/v2_offline_setup.md） ----
  external:
    totalseg:
      command: TotalSegmentator        # 可执行文件；建议写独立环境中的绝对路径，如 /opt/envs/totalseg/bin/TotalSegmentator
      home_dir: null                   # TotalSegmentator 权重目录（作为环境变量 TOTALSEG_HOME_DIR）；权重须预先拷入
      fast: false                      # true：3 mm 快速模型（精度略低，显存与时间更少）
      extra_args: []                   # 额外命令行参数
      timeout_s: 1800                  # 单例超时（秒）
    nnunet:
      bin_dir: null                    # nnU-Net 环境的 bin 目录（含 nnUNetv2_train 等）；null = 已在 PATH 中
      raw_dir: null                    # 环境变量 nnUNet_raw；null = <work_dir>/ct/nnunet/nnUNet_raw
      preprocessed_dir: null           # 环境变量 nnUNet_preprocessed；null = <work_dir>/ct/nnunet/nnUNet_preprocessed
      results_dir: null                # 环境变量 nnUNet_results；null = <work_dir>/ct/nnunet/nnUNet_results
      predict_command: null            # 推理命令（null = <bin_dir>/nnUNetv2_predict）；测试中替换为假工具
      timeout_s: 172800

  # ---- ① 胃分割（TotalSegmentator） ----
  stomach:
    min_ml: 30                         # 胃体积小于该值时提示复核（可能分割失败）

  # ---- ② 人工勾画病例抽样（只从内部训练集抽） ----
  seg_sample:
    n: 250                             # 人工勾画例数（200–300）
    seed: 2026
    stratify_by: [ct_t_group]          # 分层变量：ct_t_group（T1–T4），可加 borrmann、tumor_visibility
    min_per_group: {}                  # 各 cT 分组的最少例数，如 {T1: 30}（早期癌少，可适当多抽）
    exclude_visibility: [invisible]    # 这些可见度的病例不抽（看不到的肿瘤无法勾画）
    require_point: true                # 只抽已标中心点的病例

  # ---- ② 肿瘤分割（nnU-Net v2，胃分割外扩范围内） ----
  tumor_seg:
    dataset_id: 501
    dataset_name: GastricTumor
    configuration: 3d_fullres
    trainer: nnUNetTrainer
    folds: [0, 1, 2, 3, 4]
    margin_mm: 20                      # 胃分割外扩范围（15–20 mm）
    point_margin_mm: 48                # 同时保证中心点周围 ±该范围在框内（胃分割漏掉肿瘤所在胃壁时兜底）
    stomach_channel: true              # 第 2 个输入通道 = 胃分割
    min_component_ml: 0.5              # 小于该体积的连通域视为噪声
    max_point_dist_mm: 15              # 中心点到最近连通域超过该距离 → 标为“未找到肿瘤”
    warn_volume_ml: [1.0, 400.0]       # 肿瘤体积超出该范围时提示

  # ---- ④ CT 特征提取（冻结编码器） ----
  features:
    encoder: radimagenet_r50           # 默认编码器（命令行 --encoder 可覆盖）
    batch_size: 32
    precision: bf16                    # GPU 上 bf16；CPU 自动 fp32
    dtype: float32                     # 特征保存精度
    hash_weights: true
    input_px: 224                      # 2.5D：每层缩放到的边长
    slices_2d: {tumor: 3, regional: 7} # 2.5D：取中心层 ±k 层（5 mm 层厚下 ±3 层 = 35 mm）；null = ROI 内全部层
    channels_2d: adjacent              # 2.5D：adjacent = 相邻 3 层作 RGB；repeat = 同一层复制 3 次
    # 3D 编码器使用的额外裁剪规格（提特征时直接从 native 生成，不写裁剪文件；写法同 ct.crop.specs）
    roi_specs:
      - name: hu_tumor_96mm            # CT-FM：保留 HU（-1024–2048），编码器内部再缩放
        center: point_or_mask
        spacing: [0.8, 0.8, 5.0]
        size_vox: [120, 120, 16]
        window: {level: 512, width: 3072}
        normalize: none
      - name: hu_regional_160mm
        center: point_or_mask
        spacing: [0.8, 0.8, 5.0]
        size_vox: [200, 200, 32]
        window: {level: 512, width: 3072}
        normalize: none
      - name: merlin_abdomen           # Merlin：1.5 × 1.5 × 3 mm，224 × 224 × 160，HU −1000–1000
        center: point_or_mask
        spacing: [1.5, 1.5, 3.0]
        size_vox: [224, 224, 160]
        window: {level: 0, width: 2000}
        normalize: none
      - name: suprem_144mm             # SuPreM：1.5 mm 各向同性，96³，HU −175–250
        center: point_or_mask
        spacing: [1.5, 1.5, 1.5]
        size_vox: [96, 96, 96]
        window: {level: 37.5, width: 425}
        normalize: none
    # 各编码器：weights_path 为本地权重文件；rois 为 ROI 角色 → 裁剪规格（ct.crop.specs 或上面 roi_specs 中的名称）
    encoders:
      random_small_2d: {feature_dim: 32, rois: {tumor: tumor_96mm, regional: regional_160mm}}   # 测试用
      random_small_3d: {feature_dim: 32, rois: {tumor: tumor_96mm, regional: regional_160mm}}   # 测试用
      imagenet_r50: {weights_path: null, rois: {tumor: tumor_96mm, regional: regional_160mm}}   # torchvision resnet50 .pth
      radimagenet_r50:                 # RadImageNet ResNet50（PyTorch 权重）
        weights_path: null
        rois: {tumor: tumor_96mm, regional: regional_160mm}
        mean: [0.485, 0.456, 0.406]    # 输入标准化（需按 RadImageNet 官方说明核对）
        std: [0.229, 0.224, 0.225]
      dinov2_vitb14: {weights_path: null, rois: {tumor: tumor_96mm, regional: regional_160mm}}  # 官方 dinov2_vitb14_pretrain.pth 或 timm 权重
      merlin: {weights_path: null, rois: {regional: merlin_abdomen}}       # 需安装 merlin-vlm；权重为官方 .pt
      ctfm: {weights_path: null, rois: {tumor: hu_tumor_96mm, regional: hu_regional_160mm}}   # 需安装 monai；权重为 model.safetensors
      suprem: {weights_path: null, arch: swinunetr, rois: {tumor: suprem_144mm}}               # 需安装 monai

  # ---- ⑤ 影像组学（在 pyradiomics 独立环境中运行） ----
  radiomics:
    name: original_bw25                # 特征表名称：<work_dir>/ct/radiomics/<名称>/features.csv
    mask_sources: [manual, auto_reviewed]
    spacing: [0.8, 0.8, 5.0]           # 提取前统一重采样到的体素
    bin_width: 25                      # 灰度离散化宽度（HU）
    image_types: {Original: {}}        # 可加 LoG: {sigma: [2.0, 3.0, 4.0]}、Wavelet: {}
    feature_classes: [firstorder, shape, glcm, glrlm, glszm, gldm, ngtdm]
    min_mask_voxels: 20
    model:                             # 影像组学基线模型（每折内拟合，只用训练部分）
      corr_threshold: 0.9              # 去冗余：相关系数绝对值超过该值的特征只保留一个
      n_lambdas: 20                    # LASSO 正则化路径长度
      lambda_min_ratio: 0.01
      inner_folds: 5                   # 选择 λ 的内层交叉验证折数
      max_iter: 500

  # ---- ⑥ CT 单模态多任务模型 ----
  encoder: radimagenet_r50             # 使用的 CT 特征（④ 提取后的编码器名；命令行 --encoder 可覆盖）
  rois: [tumor, regional]              # 使用的 ROI token（特征文件中缺少的 ROI 按缺失处理）
  feature_cache: true
  model:
    aggregator: abmil                  # 2.5D 多层特征聚合为 1 个 token：abmil（门控注意力）/ meanpool
    hidden_dim: 256
    attn_dim: 128
    dropout: 0.25
  tasks:
    multiclass: [lauren]
    binary: [her2_pos, msi_h, ebv_pos, pdl1_cps1, pdl1_cps5, pdl1_cps10, cldn182_pos]
    regression: []
    survival: [os, dfs, pfs]
  population_baselines: [os]
  loss:
    weighting: uncertainty
    fixed_weights: {}
    max_pos_weight: 10
    lauren_class_weight: false
    survival_loss: discrete
    survival_bins: 4
  train:
    epochs: 50
    batch_size: 16
    lr: 2.0e-4
    weight_decay: 1.0e-4
    warmup_epochs: 2
    grad_clip: 1.0
    grad_accum: 1
    slice_dropout: 0.1                 # 训练时随机丢弃的层比例（2.5D）
    roi_dropout: 0.1                   # 训练时随机丢弃一个 ROI token 的概率（另一个保留）
    patience: 10
    num_workers: 0
    precision: bf16
  seeds: [0]
  horizons_months: [12, 36, 60]
  save_attention: true
  eval:
    n_boot: 1000
  compare:
    primary: [os, lauren]              # 编码器比较的排名指标（预先规定）：折外 OS C-index 与 Lauren 宏平均 AUC 的平均
    auxiliary: [ct_t34]                # 辅助参考（cT3–4 vs cT1–2 AUC），只报告，不参与排名
  profiles:
    screening:                         # CT 编码器初筛：Lauren + OS（+ cT 辅助头），3 个随机种子，其余超参数固定
      tasks: {multiclass: [lauren], binary: [ct_t34], regression: [], survival: [os]}
      seeds: [0, 1, 2]

# ============================================================
# v3 融合：病理 + CT 跨模态 Transformer（实现约定见 docs/decisions.md 第十四节，2026-11-01 确认）
# ============================================================
v3:
  path_encoders: [uni2_h]              # 与 v1 选定的病理编码器一致（多个表示逐切块拼接）
  ct_encoder: radimagenet_r50          # 与 v2 选定的 CT 编码器一致
  ct_rois: [tumor, regional]           # 使用的 CT ROI；消融④只用肿瘤 ROI：[tumor]
  feature_cache: true
  init:                                # 单模态初始化（CLAUDE.md 6.5 第 15 条）：同种子、同折的 v1 / v2 模型
    path_exp: null                     # v1 实验名（outputs/path_mtl/<名>）；null = 病理分支从头训练
    ct_exp: null                       # v2 实验名（outputs/ct_mtl/<名>）；null = CT 分支从头训练
  model:
    fusion: transformer                # transformer（主模型）/ concat（简单拼接）/ bilinear（门控双线性，Pathomic 式）
    missing: mask                      # mask（主方案：缺失槽位不参与注意力）/ visible（对照：占位 token 参与注意力）
    d_model: 128
    n_layers: 1
    n_heads: 4
    dropout: 0.25
    bilinear_dim: 32                   # bilinear：外积前每个模态降到的维数
    aux_heads: false                   # 消融①：单模态辅助头
    aux_weight: 0.3                    # 辅助头损失权重
    # 分支结构：从 v1 / v2 初始化时自动取其模型文件中的结构（以下设置只在"从头训练"时使用）
    path: {aggregator: abmil, hidden_dim: 256, attn_dim: 128, n_branches: 2, dropout: 0.25}
    ct: {aggregator: abmil, hidden_dim: 256, attn_dim: 128, dropout: 0.25}
  tasks:
    multiclass: [lauren]
    binary: [her2_pos, msi_h, ebv_pos, pdl1_cps1, pdl1_cps5, pdl1_cps10, cldn182_pos]
    regression: []
    survival: [os, dfs, pfs]
  population_baselines: [os]
  loss:
    weighting: uncertainty
    fixed_weights: {}
    max_pos_weight: 10
    lauren_class_weight: false
    survival_loss: discrete
    survival_bins: 4
  train:
    epochs: 50
    batch_size: 8
    lr: 2.0e-4                         # 融合层与输出头的学习率
    branch_lr_mult: 0.1                # 分支学习率 = lr × 该值（主方案：从 v1/v2 初始化后小学习率微调）
    freeze_branches: false             # 消融：冻结分支（直接用 v1/v2 的 token，只训练融合层）
    freeze_epochs: 0                   # 前若干 epoch 冻结分支（0 = 不冻结）
    weight_decay: 1.0e-4
    warmup_epochs: 2
    grad_clip: 1.0
    grad_accum: 1
    modality_dropout: 0.3              # 两种模态都有的训练病例，以该概率随机遮住其中一种（永远不会两种都遮）
    roi_dropout: 0.1                   # CT 内部随机丢弃一个 ROI（同 v2）
    slice_dropout: 0.1                 # CT 2.5D 层丢弃（同 v2）
    max_tiles: 2048                    # 病理每例训练时最多随机抽取的切块数（同 v1）
    tile_dropout: 0.1
    patience: 10                       # 内层验证（三方共用名单，见 split.inner_val_fraction）损失连续多少 epoch 不降则停
    num_workers: 0
    precision: bf16
  seeds: [0]                           # 沿用 v1 / v2 最终实验的种子（每个种子都要有对应的 v1 / v2 模型）
  horizons_months: [12, 36, 60]
  save_attention: true
  eval:
    n_boot: 1000
    missing_robustness: true           # 折外预测时，对两种都有的病例另外人为去掉 CT / 病理各预测一次
  compare:                             # 预先规定的判定规则（2026-11-01 与研究者确认，结果出来后不得修改）
    primary: [lauren, her2_pos, pdl1_cps5, cldn182_pos, os]   # 主结论：这 5 个任务主要指标的平均
    population: both                   # 主判定只用两种模态都有的病例（全部病例另报）
    n_boot: 2000                       # 配对 bootstrap 次数（按病人重抽样）
    noninferiority:                    # MSI、EBV：不进主结论，检查融合相对病理单模态"没有明显变差"
      tasks: [msi_h, ebv_pos]
      margin: 0.05                     # 差值 95% CI 下限 ≥ −margin 即通过
  late:                                # 后期融合（两模态折外预测组合）
    penalty: 1.0e-3                    # 交叉拟合堆叠（逻辑回归 / 分层 Cox）的 L1 惩罚，很小，近似不惩罚
