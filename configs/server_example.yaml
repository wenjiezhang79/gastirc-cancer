# 服务器配置模板：复制为 configs/server.yaml 后修改路径（server.yaml 不要提交到 git 中含真实路径的版本）。
_base_: default.yaml

paths:
  root: /data/gastric                 # ← 改成服务器上的数据根目录（绝对路径）
  manifest: manifest/manifest.csv     # ← 病例清单
  work_dir: work                      # 处理结果
  output_dir: /data/gastric/outputs   # 运行日志与报告

num_workers: 8

trident:
  job_dir: /data/gastric/trident_processed   # ← TRIDENT 输出根目录

features:
  extractor: uni2_h
  extractors:
    resnet50_trunc: {weights_path: /data/weights/resnet50/resnet50-0676ba61.pth}
    uni2_h: {weights_path: /data/weights/uni2-h/pytorch_model.bin}
    virchow2: {weights_path: /data/weights/virchow2/pytorch_model.bin}
    gigapath: {weights_path: /data/weights/prov-gigapath/pytorch_model.bin}

# ---- v2 CT 分支（外部工具装在独立环境中，见 docs/v2_offline_setup.md） ----
v2:
  external:
    totalseg:
      command: /opt/envs/totalseg/bin/TotalSegmentator   # ← TotalSegmentator 独立环境
      home_dir: /data/weights/totalseg_home              # ← TotalSegmentator 权重目录
    nnunet:
      bin_dir: /opt/envs/nnunet/bin                      # ← nnU-Net 独立环境
  features:
    encoders:
      imagenet_r50: {weights_path: /data/weights/resnet50/resnet50-0676ba61.pth}
      radimagenet_r50: {weights_path: /data/weights/radimagenet/ResNet50.pt}
      dinov2_vitb14: {weights_path: /data/weights/dinov2/dinov2_vitb14_pretrain.pth}
      ctfm: {weights_path: /data/weights/ct_fm/model.safetensors}
      suprem: {weights_path: /data/weights/suprem/supervised_suprem_swinunetr_2100.pth}
      merlin: {weights_path: /data/weights/merlin/merlin.pt}
